# Primary source: https://www.3dwasp.com/en/ceramic-3d-printer-wasp-40100-ldm/
# Retrieved 2026-07-22. The current successor to Delta WASP 40100 Clay specifies
# a round 400 mm bed; Clayline's box schema uses a conservative centered 240 mm square.
name = "wasp-40100-ldm"
version = "1.0.0"
description = "Community profile for current WASP 40100 LDM: round 400 mm bed using the safe centered 240 x 240 mm box; 1000 mm Z. Not yet verified on hardware."
verified = false
flavor = "marlin"
nozzle_diameters = [1.5, 2.0, 3.0]
default_nozzle_diameter = 2.0
virtual_filament_diameter = 1.75
extrusion_mode = "absolute"
speed_default = 30.0
speed_first_layer = 20.0
speed_travel = 30.0
start_gcode = ["G21 ; millimeters", "G90 ; absolute XYZ", "M82 ; absolute extrusion", "G28 ; home", "G92 E0"]
end_gcode = ["G92 E0"]
gcode_whitelist = ["G0", "G1", "G4", "G21", "G28", "G90", "G91", "G92", "M0", "M82", "M83"]

[work_bounds]
min_x = 80.0
max_x = 320.0
min_y = 80.0
max_y = 320.0
min_z = 0.0
max_z = 1000.0

[machine_envelope]
min_x = 0.0
max_x = 400.0
min_y = 0.0
max_y = 400.0
min_z = 0.0
max_z = 1000.0

[center]
x = 200.0
y = 200.0

[travel_policy]
lift = 2.0
reprime_e = 0.0
dwell_seconds = 0.0
page_pause_command = "G4 S{seconds}"

[emission]
prime_mm = 15.0
end_early_mm = 5.0
