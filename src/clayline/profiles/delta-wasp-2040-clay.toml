# Primary source: https://www.3dwasp.com/en/clay-3d-printer-delta-wasp-2040-clay/
# Retrieved 2026-07-22. The source specifies a round 200 mm bed; Clayline's box
# schema uses a deliberately conservative centered 120 x 120 mm safe square.
name = "delta-wasp-2040-clay"
version = "1.0.0"
description = "Community profile: round 200 mm bed using the safe centered 120 x 120 mm box; 400 mm Z. Not yet verified on hardware."
verified = false
flavor = "marlin"
nozzle_diameters = [1.5, 2.0, 3.0]
default_nozzle_diameter = 2.0
virtual_filament_diameter = 1.75
extrusion_mode = "absolute"
speed_default = 30.0
speed_first_layer = 20.0
speed_travel = 30.0
start_gcode = ["G21 ; millimeters", "G90 ; absolute XYZ", "M82 ; absolute extrusion", "G28 ; home", "G92 E0"]
end_gcode = ["G92 E0"]
gcode_whitelist = ["G0", "G1", "G4", "G21", "G28", "G90", "G91", "G92", "M0", "M82", "M83"]

[work_bounds]
min_x = 40.0
max_x = 160.0
min_y = 40.0
max_y = 160.0
min_z = 0.0
max_z = 400.0

[machine_envelope]
min_x = 0.0
max_x = 200.0
min_y = 0.0
max_y = 200.0
min_z = 0.0
max_z = 400.0

[center]
x = 100.0
y = 100.0

[travel_policy]
lift = 2.0
reprime_e = 0.0
dwell_seconds = 0.0
page_pause_command = "G4 S{seconds}"

[emission]
prime_mm = 15.0
end_early_mm = 5.0
