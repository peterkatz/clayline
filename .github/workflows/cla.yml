# Contributor agreement check. A pull request from anyone not on the allowlist
# is blocked until the author signs the agreement in CONTRIBUTING.md by
# commenting on the PR. Signatures are recorded on the cla-signatures branch.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Contributor agreement
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/peterkatz/clayline/blob/main/CONTRIBUTING.md#license-and-contributor-agreement
          branch: cla-signatures
          allowlist: peterkatz,dependabot[bot]
          custom-notsigned-prcomment: >-
            Thanks for the contribution. Before it can be merged, please read the
            licence and contributor agreement in CONTRIBUTING.md and sign it by
            posting the comment below.
          custom-pr-sign-comment: I have read the licence and contributor agreement in CONTRIBUTING.md and I agree to its terms.
          custom-allsigned-prcomment: All contributors have signed the contributor agreement.
